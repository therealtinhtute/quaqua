name: Release

# A tag push is the only trigger: `git tag v0.1.0 && git push origin v0.1.0`
# builds the three published targets, packages each binary with its checksum,
# and publishes them as a GitHub release. Re-running the job for the same tag
# converges on the same release: existing assets are overwritten in place, so a
# partial upload is repaired rather than duplicated.
on:
  push:
    tags: ["v*"]

# The build jobs only read the repository; the release job widens itself to
# `contents: write` below.
permissions:
  contents: read

# One release per tag, never two racing. Not cancelled: a run that dies after
# creating the release still leaves a state the next run repairs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target must not hide the other two: each job reports itself.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned by SHA to the stable ref that carries toolchain 1.99.0 — the
      # toolchain the workspace is developed and tested against; there is no
      # rust-toolchain.toml, so the pin lives here. `targets:` installs the
      # matrix target's std (on macOS the non-native arch is a cross-build).
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: cargo build --release
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p quaqua --target "$TARGET"

      - name: Package tar.gz + .sha256
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="quaqua-${GITHUB_REF_NAME}-${TARGET}"
          bin="target/${TARGET}/release/quaqua"
          test -x "$bin"
          stage="$(mktemp -d)"
          cp "$bin" LICENSE README.md "$stage/"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C "$stage" quaqua LICENSE README.md
          # ubuntu-latest has sha256sum; macOS ships shasum. Both write
          # `<hash>  <file>` so `sha256sum -c` verifies the same format.
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
            else
              shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
            fi
          )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # All three targets into one flat directory: 3 archives + 3 checksums.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify archives and checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( *.tar.gz )
          if [ "${#archives[@]}" -ne 3 ]; then
            echo "expected 3 archives, found ${#archives[@]}: ${archives[*]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            test -f "${archive}.sha256"
            sha256sum -c "${archive}.sha256"
            tar -tzf "$archive" >/dev/null
          done

      # Publishing converges: the first run creates the release with all six
      # assets; any later run for the same tag uploads over them with
      # `--clobber`, which also completes a release left half-uploaded.
      #
      # gh resolves the repository from the git remote of the working
      # directory. This job downloads artifacts instead of checking out, so
      # there is no worktree and every gh call would die with "failed to run
      # git: fatal: not a git repository" before touching the API. GH_REPO
      # gives gh the repository directly and skips that resolution.
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "quaqua $TAG" \
              --generate-notes
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort
