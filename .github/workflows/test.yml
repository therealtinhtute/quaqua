name: Test

# Every PR into main, and every push to main, runs the workspace test suite.
# The check name is "Test / cargo test (workspace)"; make it a required status
# check in branch protection to block merges on red.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The job only reads the repository.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in flight.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as release.yml: the stable ref that carries toolchain 1.99.0,
      # the toolchain the workspace is developed and tested against.
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2

      # The runner has neither herdr nor tmux. Every test that reaches for the
      # daemon sets GRID_SKIP=1 + QUAQUA_TEST=1, so the whole suite runs here.
      - name: cargo test --locked
        run: cargo test --locked
