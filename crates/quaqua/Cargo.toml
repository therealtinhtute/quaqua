[package]
name = "quaqua"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned exactly: this binary replaces the bash engine, so the dependency tree
# must be reproducible (Cargo.lock is committed alongside).
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
serde_json = "=1.0.150"
ureq = { version = "=2.10.1", default-features = false, features = ["tls", "json"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
