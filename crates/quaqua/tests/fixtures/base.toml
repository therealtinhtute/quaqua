# Minimal VALID config used as the base for the invalid fixtures. Deliberately
# small: each invalid fixture below is this file with exactly one mutation, so
# the error it yields points at that mutation alone.
schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["quansu"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.quansu]
harness = "codex"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
