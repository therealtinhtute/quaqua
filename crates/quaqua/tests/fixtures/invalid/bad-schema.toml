# invalid: schema_version other than 2.
schema_version = 1

[strategy]
default_kind = "tieude"
default_reviewer = ["quansu"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.quansu]
harness = "codex"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
