# invalid: timer duration string has invalid unit or format
schema_version = 2

[limits]
max_workers_per_orchestrator = 4

[timers]
budget_default = "invalid_duration"
hard_cap = "120m"
stall = "10m"
idle = "2m"
nudge_at = 0.8
grace = 0.25
pilot_budget = "30m"

[strategy]
default_kind = "tieude"
default_reviewer = ["quansu"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.quansu]
harness = "codex"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
