# invalid: a pipeline weight larger than the per-orchestrator cap.
schema_version = 2

[limits]
max_workers_per_orchestrator = 4
weights = { default = 1, pipeline = 5 }

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
