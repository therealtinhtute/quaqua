# invalid: limits.max_workers_per_orchestrator above the AGENTS.md ceiling of 4.
schema_version = 2

[limits]
max_workers_per_orchestrator = 5

[strategy]
default_kind = "tieude"
default_reviewer = ["quansu"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.quansu]
harness = "codex"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
