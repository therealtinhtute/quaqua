# invalid: max_peers belongs to [roles.lead]; a CoS-level Peer cap would never fire.
schema_version = 2

[roles.cos]
can_spawn = ["lead"]
max_peers = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
