# invalid: builder_reviewer_differ is outside none|harness|kind.
schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]
builder_reviewer_differ = "weird"

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
