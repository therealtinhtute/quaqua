schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "m"
effort = "max"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "m"
effort = "high"
fallback = "tieude"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
