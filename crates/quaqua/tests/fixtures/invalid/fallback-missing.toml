# invalid: a fallback naming a kind that does not exist.
schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "opencode-go/deepseek-v4.1-flash"
effort = "max"
fallback = "ghost"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "opus-5.5"
effort = "medium"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
