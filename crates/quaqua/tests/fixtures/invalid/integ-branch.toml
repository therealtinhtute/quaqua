# invalid: merge.integ_branch has no {slug} placeholder.
schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["quansu"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.quansu]
harness = "codex"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua-integ"
