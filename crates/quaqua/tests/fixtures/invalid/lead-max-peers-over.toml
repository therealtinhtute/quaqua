# invalid: [roles.lead] max_peers may not exceed the global worker cap (8).
schema_version = 2

[limits]
max_workers_per_orchestrator = 8

[roles.lead]
max_peers = 9

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
