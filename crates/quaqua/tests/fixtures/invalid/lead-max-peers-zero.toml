# invalid: [roles.lead] max_peers below 1 leaves a Lead unable to spawn a Peer.
schema_version = 2

[roles.lead]
max_peers = 0

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
