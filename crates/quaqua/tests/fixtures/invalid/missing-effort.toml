# invalid: a kind with no effort (team.toml is the only source; no default exists).
schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "opencode-go/deepseek-v4.1-flash"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "opus-5.5"
effort = "medium"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
