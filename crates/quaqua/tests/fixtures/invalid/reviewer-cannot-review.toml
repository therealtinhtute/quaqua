# invalid: a default_reviewer kind whose can_review = false.
schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["sude"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.sude]
harness = "omp"
model = "m"
can_review = false

[merge]
integ_branch = "quaqua/{slug}-integ"
