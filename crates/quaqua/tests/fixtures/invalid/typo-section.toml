# invalid: a misspelled top-level table (`project` vs `projects`) must be
# rejected, not silently ignored (which would drop the override).
schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["quansu"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.quansu]
harness = "codex"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"

[project.zimage]
max_workers_per_orchestrator = 3
