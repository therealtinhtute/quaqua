# invalid: can_spawn references a role class outside cos|lead|peer|taskforce.
schema_version = 2

[roles.cos]
can_spawn = ["ghostrole"]
can_prompt = []

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
