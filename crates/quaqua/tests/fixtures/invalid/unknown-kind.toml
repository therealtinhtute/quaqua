# invalid: strategy.default_kind names a kind with no [kinds.*] table.
schema_version = 2

[strategy]
default_kind = "ghost"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
