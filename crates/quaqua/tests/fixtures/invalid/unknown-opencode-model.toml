# invalid: opencode model is not in the variant allowlist.
schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "opencode-go/unknown-model"
effort = "max"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "opus-5.5"
effort = "medium"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
