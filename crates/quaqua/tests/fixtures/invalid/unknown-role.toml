# invalid: a [roles.<r>] table key outside cos|lead|peer.
schema_version = 2

[roles.ghost]
can_spawn = []
can_prompt = []
reports_to = "cos"

[strategy]
default_kind = "tieude"
default_reviewer = ["quansu"]

[kinds.tieude]
harness = "opencode"
model = "m"
can_review = false

[kinds.quansu]
harness = "codex"
model = "m"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"
