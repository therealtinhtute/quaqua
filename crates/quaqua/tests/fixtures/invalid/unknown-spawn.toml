# invalid: `spawn` only takes "auto" or "approve"; anything else must be rejected.
schema_version = 2

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "opencode-go/deepseek-v4.1-flash"
effort = "max"
can_review = false
spawn = "sometimes"

[kinds.suhuynh]
harness = "claude"
model = "m"
effort = "high"
can_review = true
spawn = "auto"

[merge]
integ_branch = "quaqua/{slug}-integ"
