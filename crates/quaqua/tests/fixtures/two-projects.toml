# VALID config with several project overrides. Regression fixture for review
# round 2 finding 1: `validate --project b` must not re-check project a (cap 3)
# or the weights (pipeline = 2) against b's resolved cap (2), and a project with
# cap 1 must still validate for every --project.
schema_version = 2

[limits]
max_workers_per_orchestrator = 4
weights = { default = 1, pipeline = 2, "dual-lens" = 2 }

[strategy]
default_kind = "tieude"
default_reviewer = ["suhuynh"]

[kinds.tieude]
harness = "opencode"
model = "m"
effort = "max"
can_review = false

[kinds.suhuynh]
harness = "claude"
model = "m"
effort = "high"
can_review = true

[merge]
integ_branch = "quaqua/{slug}-integ"

[projects.a]
max_workers_per_orchestrator = 3

[projects.b]
max_workers_per_orchestrator = 2

[projects.c]
max_workers_per_orchestrator = 1
