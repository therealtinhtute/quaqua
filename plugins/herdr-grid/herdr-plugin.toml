id = "herdr-grid"
name = "herdr-grid"
version = "1.0.0"
description = "Automatic agent grid layout reconciler for Herdr"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[events]]
on = "pane.created"
command = ["bash", "hook.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "hook.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "hook.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "hook.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "hook.sh"]

[[events]]
on = "workspace.closed"
command = ["bash", "hook.sh"]
