id = "herdr-quaqua"
name = "herdr-quaqua"
version = "1.0.0"
description = "Automatic agent grid layout reconciler for Herdr"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[events]]
on = "pane.created"
command = ["quaqua", "grid", "hook"]

[[events]]
on = "pane.agent_detected"
command = ["quaqua", "grid", "hook"]

[[events]]
on = "pane.agent_status_changed"
command = ["quaqua", "grid", "hook"]

[[events]]
on = "pane.moved"
command = ["quaqua", "grid", "hook"]

[[events]]
on = "tab.closed"
command = ["quaqua", "grid", "hook"]

[[events]]
on = "workspace.closed"
command = ["quaqua", "grid", "hook"]

[[events]]
on = "pane.agent_status_changed"
command = ["quaqua", "events", "hook"]

[[events]]
on = "pane.exited"
command = ["quaqua", "events", "hook"]
